[project]
name = "paper-kit"
version = "0.1.0"
description = "Measured figure sizes, a shared figure style and page-fit checks for LaTeX papers"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "cycler"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_kit"]
